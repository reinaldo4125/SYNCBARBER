<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F0F12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Barbería App" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>SYNCBARBER - Agendamiento de Citas & Barbería</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            // Periodic update check every 2 minutes
            setInterval(() => {
              registration.update().catch(() => {});
            }, 120000);

            // Check if there is already a waiting service worker
            if (registration.waiting) {
              window.dispatchEvent(new CustomEvent('syncbarber_sw_update_ready', { detail: { registration } }));
            }

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('syncbarber_sw_update_ready', { detail: { registration } }));
                  }
                });
              }
            });
          }).catch(err => {
            console.log('ServiceWorker registration ignored:', err);
          });

          // Check on window refocus
          window.addEventListener('focus', () => {
            navigator.serviceWorker.getRegistration().then(reg => reg?.update().catch(() => {}));
          });
        });
      }
    </script>
  </head>
  <body class="bg-[#0F0F12] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
